<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus chamados | TecnoLar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a href="../index.html" class="logo"><span class="logo-icone"></span>TECNOLAR</a>
      <div class="d-flex align-items-center gap-3">
        <span class="topo-ajuda d-none" id="texto-usuario-logado"></span>
        <a href="#" class="topo-ajuda d-none" id="link-sair-topo">Sair</a>
      </div>
    </div>
  </header>

  <main class="container py-4 largura-760">
    <div class="d-flex justify-content-between align-items-start mb-1 flex-wrap gap-2">
      <h1 class="h3 mb-1">Meus chamados</h1>
      <a href="chamado-passo-1.html" class="botao botao-secundario botao-pequeno">+ Abrir novo chamado</a>
    </div>
    <p class="text-secondary mb-4">Acompanhe a visita, veja o orçamento e aprove o reparo por aqui.</p>
    <div id="lista-chamados"></div>
  </main>

  <!-- Modelos: o JS clona cada um deles e preenche com os dados do chamado -->
  <template id="modelo-chamado-cliente">
    <div class="cartao mb-3">
      <div class="cartao-corpo">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <strong class="d-block js-numero-aparelho"></strong>
            <span class="d-block small text-secondary js-endereco-data"></span>
          </div>
          <span class="badge rounded-pill js-status"></span>
        </div>
        <p class="small text-secondary mb-3 js-aviso-orcamento"></p>
        <a class="botao botao-secundario botao-total js-link-acompanhar" href="#">Ver detalhes</a>
      </div>
    </div>
  </template>

  <template id="modelo-sem-chamados">
    <div class="alerta alerta-info">
      <span class="alerta-icone"></span>
      <div>
        <strong>Você ainda não abriu nenhum chamado.</strong>
        <p>Quando precisar de uma visita técnica, é só abrir um chamado em 3 passos.</p>
      </div>
    </div>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/paginas/meus-chamados.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/acessibilidade.js"></script>
</body>
</html>
