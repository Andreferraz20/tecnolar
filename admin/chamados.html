<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamados · Painel admin | TecnoLar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="../index.html" class="logo mb-4 d-inline-flex"><span class="logo-icone"></span>TECNOLAR</a>
      <nav class="nav flex-column gap-1">
        <a class="nav-link active" href="chamados.html">Chamados</a>
        <a class="nav-link" href="../cliente/chamado-passo-1.html">Novo chamado</a>
        <a class="nav-link" href="#">Mapa de setores</a>
        <a class="nav-link" href="#">Equipes e técnicos</a>
        <a class="nav-link" href="#" id="link-em-risco">Em risco <span class="badge rounded-pill text-bg-danger" id="contador-risco">0</span></a>
        <a class="nav-link" href="#">Relatórios</a>
      </nav>
      <hr>
      <p class="small text-secondary px-2 mb-2" id="texto-usuario-logado"></p>
      <nav class="nav flex-column gap-1">
        <a class="nav-link" href="#">Configurações</a>
        <a class="nav-link text-secondary" href="#" id="link-sair">Sair</a>
      </nav>
    </aside>

    <main class="admin-main">
      <button class="botao-menu-admin" type="button" id="botao-menu-admin" aria-label="Abrir menu">☰</button>
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">Chamados</h1>
          <p class="text-secondary mb-0" id="texto-resumo-topo">—</p>
        </div>
        <div class="d-flex gap-2">
          <button class="botao botao-secundario" type="button" id="botao-exportar">Exportar</button>
          <a href="../cliente/chamado-passo-1.html" class="botao botao-primario">+ Novo chamado</a>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="cartao-estatistica">
            <p class="dica mb-1">Aguardando distribuição</p>
            <strong class="fs-3 font-titulo texto-azul-escuro" id="num-aguardando">0</strong>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="cartao-estatistica">
            <p class="dica mb-1">Em atendimento</p>
            <strong class="fs-3 font-titulo texto-azul-escuro" id="num-atendimento">0</strong>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="cartao-estatistica">
            <p class="dica mb-1">Aguardando aprovação</p>
            <strong class="fs-3 font-titulo texto-azul-escuro" id="num-aprovacao">0</strong>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="cartao-estatistica risco">
            <p class="dica mb-1 texto-vermelho">Em risco de SLA</p>
            <strong class="fs-3 font-titulo texto-vermelho" id="num-risco">0</strong>
          </div>
        </div>
      </div>

      <ul class="nav nav-pills gap-2 mb-3" id="filtros-status">
        <li class="nav-item"><button class="nav-link active" data-filtro="todos">Todos</button></li>
        <li class="nav-item"><button class="nav-link" data-filtro="sem-tecnico">Sem técnico</button></li>
        <li class="nav-item"><button class="nav-link" data-filtro="urgente">Urgente</button></li>
      </ul>

      <div class="table-responsive caixa-arredondada">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr class="small text-secondary text-uppercase">
              <th>Nº</th>
              <th>Aparelho / Defeito</th>
              <th>Cliente · Setor</th>
              <th>Equipe · Técnico</th>
              <th>SLA</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela-chamados"></tbody>
        </table>
      </div>
      <p class="text-secondary small mt-2" id="texto-paginacao">—</p>
    </main>
  </div>

  <!-- Modelo de linha da tabela: o JS clona isto pra cada chamado -->
  <template id="modelo-linha-chamado">
    <tr class="linha-clicavel">
      <td class="fw-semibold js-numero"></td>
      <td>
        <strong class="d-block small js-aparelho"></strong>
        <span class="text-secondary small js-defeito"></span>
      </td>
      <td class="small">
        <span class="js-cliente"></span><br>
        <span class="text-secondary js-setor"></span>
      </td>
      <td class="small js-equipe-tecnico"></td>
      <td class="small js-sla"></td>
      <td><span class="badge rounded-pill js-status"></span></td>
    </tr>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/paginas/admin-chamados.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/acessibilidade.js"></script>
</body>
</html>
