<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus chamados · Painel do técnico | TecnoLar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a href="../index.html" class="logo"><span class="logo-icone"></span>TECNOLAR</a>
      <nav class="topo-acoes">
        <span class="topo-ajuda" id="texto-tecnico-logado"></span>
        <a href="#" id="link-sair">Sair</a>
      </nav>
    </div>
  </header>

  <main class="container py-4 largura-760">
    <h1 class="h3 mb-1">Meus chamados</h1>
    <p class="text-secondary mb-4">Marque a saída pra visita e envie o orçamento depois do diagnóstico.</p>
    <div id="lista-chamados"></div>
  </main>

  <!-- Modelos: o JS clona cada um deles e preenche com os dados do chamado -->
  <template id="modelo-chamado-tecnico">
    <div class="cartao mb-3">
      <div class="cartao-corpo">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <strong class="d-block js-numero-aparelho"></strong>
            <span class="d-block small text-secondary js-defeito"></span>
          </div>
          <span class="badge rounded-pill js-status"></span>
        </div>
        <p class="small text-secondary mb-3 js-cliente-endereco"></p>
        <div class="js-acao"></div>
      </div>
    </div>
  </template>

  <template id="modelo-acao-fila">
    <div>
      <div class="alerta alerta-info">
        <span class="alerta-icone"></span>
        <div><strong>Esperando você sair</strong><p>Quando pegar a estrada, marca como "a caminho" pra o cliente acompanhar.</p></div>
      </div>
      <button class="botao botao-primario botao-total" type="button" data-acao="em-rota">Marcar que estou a caminho</button>
    </div>
  </template>

  <template id="modelo-acao-reparo">
    <div>
      <div class="alerta alerta-info">
        <span class="alerta-icone"></span>
        <div><strong>Orçamento aprovado</strong><p>Depois de fazer o conserto, marca como concluído.</p></div>
      </div>
      <button class="botao botao-primario botao-total" type="button" data-acao="concluir-reparo">Marcar reparo como concluído</button>
    </div>
  </template>

  <template id="modelo-acao-orcamento">
    <form class="form-orcamento">
      <h3 class="h6">Enviar orçamento</h3>
      <div class="itens-orcamento"></div>
      <button class="botao botao-secundario botao-pequeno mb-2" type="button" data-acao="add-item">+ item</button>
      <div class="d-flex justify-content-between fw-semibold border-top pt-2 mb-2">
        <span>Total</span><span class="total-orcamento">R$ 0</span>
      </div>
      <button class="botao botao-primario botao-total" type="submit">Enviar orçamento</button>
    </form>
  </template>

  <template id="modelo-item-orcamento">
    <div class="item-orcamento">
      <input class="entrada js-descricao" type="text" placeholder="Peça ou serviço" required>
      <input class="entrada valor-item js-valor" type="number" min="0" step="0.01" placeholder="R$">
      <button class="botao botao-secundario botao-pequeno" type="button" data-acao="remover-item">×</button>
    </div>
  </template>

  <template id="modelo-mensagem-simples">
    <p class="dica mb-0 js-texto"></p>
  </template>

  <script src="../js/app.js"></script>
  <script src="../js/paginas/tecnico-chamados.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/acessibilidade.js"></script>
</body>
</html>
