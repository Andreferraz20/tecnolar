<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | TecnoLar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="login-faixa">
    <a href="index.html" class="logo logo-claro">
      <span class="logo-icone"></span>
      TECNOLAR <small>assistência técnica</small>
    </a>
  </header>

  <main class="login-principal">
    <section class="login-cartao">
      <div class="login-cabecalho">
        <span class="logo-icone"></span>
        <div>
          <h1>Entrar</h1>
          <p>Clientes, técnicos e equipe interna</p>
        </div>
      </div>

      <form class="login-form" id="form-login">
        <div class="alerta alerta-erro d-none" id="erro-login">
          <span class="alerta-icone"></span>
          <p>Login ou senha incorretos.</p>
        </div>

        <div class="campo">
          <label for="login">Login</label>
          <input class="entrada" type="text" id="login" name="login" placeholder="6 letras" maxlength="6" required>
        </div>

        <div class="campo">
          <div class="rotulo-linha">
            <label for="senha">Senha</label>
            <a href="#">Esqueci minha senha</a>
          </div>
          <div class="senha-caixa">
            <input class="entrada" type="password" id="senha" name="senha" placeholder="••••••••" required>
            <button type="button" class="senha-mostrar" id="mostrar-senha">mostrar</button>
          </div>
        </div>

        <label class="checkbox">
          <input type="checkbox" name="manter-conectado">
          Manter conectado neste dispositivo
        </label>

        <button type="submit" class="botao botao-primario botao-total">Entrar</button>

        <p class="dica text-center mt-2">
          Demo: <code>gestor</code> / <code>gestores</code> (admin)
          — <code>ricard</code> / <code>clientes</code> (cliente)
          — <code>leotec</code> / <code>tecnicos</code> (técnico)
        </p>

        <div class="login-rodape">
          <span>Ainda não tem conta? <a href="cliente/cadastro.html">Criar conta</a></span>
          <a href="cliente/chamado-acompanhar.html">Rastrear sem login</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/paginas/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/acessibilidade.js"></script>
</body>
</html>
